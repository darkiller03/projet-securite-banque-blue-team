{% extends "base.html" %}
{% block contenu %}
<h1>Mon conseiller</h1>
<div class="chat">
  {% for m in fils %}
    <div class="bulle {{ 'moi' if m.auteur == 'client' else 'autre' }}">
      <div class="bulle-txt">{{ m.contenu }}</div>
      <div class="bulle-date">{{ m.date_msg }}</div>
    </div>
  {% else %}
    <p>Aucun message. Écrivez à votre conseiller ci-dessous.</p>
  {% endfor %}
</div>
<form method="post" class="chat-form">
  <input type="text" name="contenu" placeholder="Votre message..." required>
  <button type="submit" class="btn">Envoyer</button>
</form>
{% endblock %}
