{% extends "base.html" %}
{% block titre %}{{ titre }}{% endblock %}
{% block contenu %}
<div class="carte etroite">
  <h1>{{ titre }}</h1>
  <form method="post" action="{{ action }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>E-mail <input type="email" name="email" required autofocus></label>
    <label>Mot de passe <input type="password" name="mot_de_passe" required></label>
    <button class="bouton plein">Se connecter</button>
  </form>
  {% if titre == 'Espace client' %}
  <p class="discret">Pas encore client ? <a href="{{ url_for('inscription') }}">Ouvrir un compte</a></p>
  {% endif %}
</div>
{% endblock %}
