<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- Titre -->
  <text x="600" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">SI simulé : Banque de Proximité du Centre (fictive)</text>
  <text x="600" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Projet sécurité INSA CVL, groupe Hassini. Réseaux en 10.X.VLAN.0/24 (X = numéro de range Ludus)</text>

  <!-- Internet -->
  <ellipse cx="480" cy="115" rx="90" ry="32" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="480" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#374151">Internet</text>
  <text x="480" y="130" text-anchor="middle" font-size="11" fill="#6b7280">(attaquant, clients)</text>

  <!-- VPN vers l'agence -->
  <path d="M570,115 L1035,115 L1035,200" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="800" y="106" text-anchor="middle" font-size="12" fill="#4b5563">VPN IPsec site-à-site</text>

  <!-- Liens réseau -->
  <g stroke="#6b7280" stroke-width="2" fill="none">
    <line x1="480" y1="147" x2="480" y2="200"/>
    <line x1="480" y1="250" x2="480" y2="275"/>
    <line x1="175" y1="275" x2="745" y2="275"/>
    <line x1="175" y1="275" x2="175" y2="300"/>
    <line x1="470" y1="275" x2="470" y2="300"/>
    <line x1="745" y1="275" x2="745" y2="300"/>
    <line x1="630" y1="275" x2="630" y2="580"/>
    <line x1="175" y1="580" x2="630" y2="580"/>
    <line x1="175" y1="580" x2="175" y2="600"/>
    <line x1="470" y1="580" x2="470" y2="600"/>
    <line x1="1035" y1="250" x2="1035" y2="300"/>
  </g>

  <!-- Site siège -->
  <rect x="30" y="170" width="840" height="610" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="48" y="194" font-size="15" font-weight="700" fill="#374151">Siège (site 1)</text>

  <!-- OPNsense siège -->
  <rect x="380" y="200" width="200" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="480" y="221" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">OPNsense siège</text>
  <text x="480" y="239" text-anchor="middle" font-size="11" fill="#7f1d1d">filtrage inter-VLAN, VPN, logs</text>

  <!-- DMZ -->
  <rect x="50" y="300" width="250" height="260" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="65" y="321" font-size="14" font-weight="700" fill="#9a3412">DMZ, VLAN 10</text>
  <text x="65" y="338" font-size="11" fill="#9a3412">10.X.10.0/24</text>
  <g font-size="13">
    <rect x="65" y="350" width="220" height="42" rx="6" fill="#fff" stroke="#ea580c"/>
    <text x="75" y="367" font-weight="700" fill="#1f2937">WEB01 : banque en ligne</text>
    <text x="75" y="384" font-size="11" fill="#6b7280">Debian 12, nginx, appli web</text>
    <rect x="65" y="400" width="220" height="42" rx="6" fill="#fff" stroke="#ea580c"/>
    <text x="75" y="417" font-weight="700" fill="#1f2937">MAIL01 : messagerie</text>
    <text x="75" y="434" font-size="11" fill="#6b7280">Debian 12, Postfix / Dovecot</text>
  </g>

  <!-- Serveurs internes -->
  <rect x="320" y="300" width="300" height="260" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="335" y="321" font-size="14" font-weight="700" fill="#1e3a8a">Serveurs internes, VLAN 20</text>
  <text x="335" y="338" font-size="11" fill="#1e3a8a">10.X.20.0/24</text>
  <g font-size="13">
    <rect x="335" y="350" width="270" height="42" rx="6" fill="#fff" stroke="#2563eb"/>
    <text x="345" y="367" font-weight="700" fill="#1f2937">MM01 : Mattermost</text>
    <text x="345" y="384" font-size="11" fill="#6b7280">Debian 12, Docker, réseau social d'entreprise</text>
    <rect x="335" y="400" width="270" height="42" rx="6" fill="#fff" stroke="#2563eb"/>
    <text x="345" y="417" font-weight="700" fill="#1f2937">DC01 : AD DS / DNS</text>
    <text x="345" y="434" font-size="11" fill="#6b7280">Windows Server 2022, domaine banque.local</text>
    <rect x="335" y="450" width="270" height="42" rx="6" fill="#fff" stroke="#2563eb"/>
    <text x="345" y="467" font-weight="700" fill="#1f2937">FS01 : serveur de fichiers</text>
    <text x="345" y="484" font-size="11" fill="#6b7280">Windows Server 2022, partages SMB</text>
    <rect x="335" y="500" width="270" height="42" rx="6" fill="#fff" stroke="#2563eb"/>
    <text x="345" y="517" font-weight="700" fill="#1f2937">CORE01 : core banking</text>
    <text x="345" y="534" font-size="11" fill="#6b7280">Debian 12, appli métier + PostgreSQL</text>
  </g>

  <!-- Utilisateurs siège -->
  <rect x="640" y="300" width="210" height="260" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="652" y="321" font-size="14" font-weight="700" fill="#14532d">Utilisateurs, VLAN 30</text>
  <text x="652" y="338" font-size="11" fill="#14532d">10.X.30.0/24</text>
  <g font-size="13">
    <rect x="652" y="350" width="186" height="42" rx="6" fill="#fff" stroke="#16a34a"/>
    <text x="662" y="367" font-weight="700" fill="#1f2937">PC-CONS01 : conseiller</text>
    <text x="662" y="384" font-size="11" fill="#6b7280">Windows 11, joint au domaine</text>
    <rect x="652" y="400" width="186" height="42" rx="6" fill="#fff" stroke="#16a34a"/>
    <text x="662" y="417" font-weight="700" fill="#1f2937">PC-DIR01 : direction</text>
    <text x="662" y="434" font-size="11" fill="#6b7280">Windows 11, joint au domaine</text>
  </g>

  <!-- Administration -->
  <rect x="50" y="600" width="250" height="150" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="65" y="621" font-size="14" font-weight="700" fill="#581c87">Administration, VLAN 40</text>
  <text x="65" y="638" font-size="11" fill="#581c87">10.X.40.0/24</text>
  <rect x="65" y="650" width="220" height="42" rx="6" fill="#fff" stroke="#9333ea"/>
  <text x="75" y="667" font-size="13" font-weight="700" fill="#1f2937">ADM01 : bastion</text>
  <text x="75" y="684" font-size="11" fill="#6b7280">accès admin SSH, RDP, WinRM</text>

  <!-- SOC -->
  <rect x="320" y="600" width="300" height="150" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="335" y="621" font-size="14" font-weight="700" fill="#134e4a">Supervision SOC, VLAN 50</text>
  <text x="335" y="638" font-size="11" fill="#134e4a">10.X.50.0/24</text>
  <rect x="335" y="650" width="270" height="42" rx="6" fill="#fff" stroke="#0d9488"/>
  <text x="345" y="667" font-size="13" font-weight="700" fill="#1f2937">SIEM01 : ELK</text>
  <text x="345" y="684" font-size="11" fill="#6b7280">Elasticsearch, Kibana, collecte des logs</text>
  <text x="335" y="718" font-size="11" fill="#134e4a">Réservé à la blue team, hors périmètre d&apos;attaque</text>

  <!-- Légende -->
  <rect x="640" y="600" width="210" height="150" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="652" y="621" font-size="13" font-weight="700" fill="#374151">Légende</text>
  <line x1="652" y1="642" x2="692" y2="642" stroke="#6b7280" stroke-width="2"/>
  <text x="700" y="646" font-size="11" fill="#374151">lien filtré par OPNsense</text>
  <line x1="652" y1="664" x2="692" y2="664" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="700" y="668" font-size="11" fill="#374151">tunnel VPN IPsec</text>
  <rect x="652" y="678" width="40" height="14" rx="3" fill="#fee2e2" stroke="#dc2626"/>
  <text x="700" y="690" font-size="11" fill="#374151">pare-feu</text>
  <text x="652" y="714" font-size="11" fill="#374151">10 machines cibles</text>
  <text x="652" y="732" font-size="11" fill="#374151">Refus par défaut, tout journalisé</text>

  <!-- Agence -->
  <rect x="900" y="170" width="270" height="390" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="918" y="194" font-size="15" font-weight="700" fill="#374151">Agence (site 2)</text>
  <rect x="955" y="200" width="160" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="1035" y="221" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">OPNsense agence</text>
  <text x="1035" y="239" text-anchor="middle" font-size="11" fill="#7f1d1d">VPN vers le siège</text>
  <rect x="915" y="300" width="240" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="930" y="321" font-size="14" font-weight="700" fill="#14532d">Guichet, VLAN 60</text>
  <text x="930" y="338" font-size="11" fill="#14532d">10.X.60.0/24</text>
  <rect x="930" y="350" width="210" height="42" rx="6" fill="#fff" stroke="#16a34a"/>
  <text x="940" y="367" font-size="13" font-weight="700" fill="#1f2937">PC-GUI01 : guichet</text>
  <text x="940" y="384" font-size="11" fill="#6b7280">Windows 11, joint au domaine</text>
  <text x="918" y="490" font-size="11" fill="#6b7280">Dans Ludus : VLAN dédié, ou 2e</text>
  <text x="918" y="506" font-size="11" fill="#6b7280">OPNsense avec un vrai tunnel IPsec</text>
  <text x="918" y="522" font-size="11" fill="#6b7280">(à trancher selon les ressources)</text>
</svg>
